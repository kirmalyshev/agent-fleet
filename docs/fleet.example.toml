# fleet.toml: how `agent-fleet spawn` starts agents, and which repositories this machine serves.
#
# `agent-fleet init` writes this file, with a profile for each agent program it finds on PATH,
# into the user config dir (~/.config/agent-fleet on Linux, instances/<name> under it for an
# instance other than `default`; AGENT_FLEET_CONFIG_DIR overrides it), next to brief.md. These are the machine's rules: every connected repository uses them,
# unless the repository has its own `.agent-fleet/fleet.toml`, which then replaces this file
# wholesale for that repository ([repos] below is only ever read from the machine's file).
# A commented-out key shows its default or an example: uncomment it to use it.

# session = "work"               # herdr session agents run in; absent = the session the CLI runs in (HERDR_SESSION)
# base = "origin/main"           # branch point for a new worktree
brief = "brief.md"               # brief template next to this file; @@KEY@@ placeholders: NAME, KIND, PROGRAM,
                                 # SLUG, ISSUE, TITLE, BRANCH, SCOPE, HOST, LEVEL, LEAD, HANDOFF, REF, TASK,
                                 # each [vars] key and each `spawn --set KEY=VALUE`
# ready = "scripts/worktree-ready.sh"   # run inside a NEW worktree with its path as $1, before the agent starts
# retire = "scripts/worktree-retire.sh" # run with a closed agent's worktree as $1, under the retire locks;
#                                       # `--decide=delete` follows when uncommitted changes were accepted,
#                                       # and AGENT_FLEET_RETIRE_LOCK_FD names the repo lock it may re-enter;
#                                       # absent: `agent-fleet retire` runs `git worktree remove`, and a
#                                       # closed pane leaves its tree
# retire_patches = "~/retired-patches"  # where `agent-fleet retire --decide=stash` writes (default: data dir)

# [vars]                         # extra brief tokens: @@ORG@@ renders "example"
# ORG = "example"

# Profiles: how to start one agent program. One profile per program found on PATH; add more,
# e.g. one per model. Keys:
#   kind        the program: claude, codex or devin (agent.start's kind and agent.quota's kind)
#   args        extra arguments for the program, e.g. ["--model", "opus"]
#   unset_env   variables cleared in the pane's shell before the agent starts
#   prefix      the default agent name is prefix + issue number; profiles never share a prefix
#   cap         live agents of this profile per repository; absent = no cap
#   fallback    the profile used when this one's quota is out, and `agent-fleet handoff`'s default
#   on_quota    the ONLY automatic handoff (host --stuck-act required): a stuck agent whose kind
#               is out of quota with a KNOWN reset >30m away moves to this profile, if its kind
#               still has quota on this host
#   handoff_min minutes a spawned agent has to reach `working` before its lead is told (default 5)

[profiles.claude]
kind = "claude"
args = []
prefix = "c-"

[profiles.codex]
kind = "codex"
args = []
prefix = "x-"

[profiles.devin]
kind = "devin"
args = []
prefix = "dv-"

# [profiles.opus]                # a second claude profile, picked by a rule below
# kind = "claude"
# args = ["--model", "opus"]
# prefix = "o-"
# cap = 2
# fallback = "claude"

# Rules route an issue to a profile: the first rule that matches wins, so the default rule
# (no `match`) comes last. `match` keywords are OR'd, case-insensitive whole words against the
# issue's title and labels; `label:x` matches only a label named x. Optional keys:
#   host   the host to spawn on (default: the host running the CLI)
#   level  the agent.role level of the new agent (default implementer)
# [[rules]]
# match = ["research", "design", "label:design"]
# profile = "opus"
# host = "build-box"

[[rules]]                        # the default rule
profile = "claude"

# Pull requests no live agent owns (`agent-fleet doctor`, finding `orphan-pr`).
# [orphan_pr]
# repos = ["owner/repo"]         # absent = every repository in [repos]; [] = off
# days = 3                       # quiet this long before a PR is an orphan
# guarded = ["AGENTS.md", "CLAUDE.md", "README.md", "docs/", "schema/"]  # reported, never closed (`dir/` = prefix); setting it replaces this default
# apply = false                  # true: the host watch loop closes superseded PRs and tells the root coordinator of the rest

# The host's housekeeping for this project. Each table is off unless present.
# [chores.nudge]                 # a stuck agent: Enter for a prompt sitting unsent (twice, then one
# kinds = ["devin"]              #   esc + the same text if it can be read, else a BLOCKED tell to the
# unsent_hints = []              #   lead), `continue` after a rate limit lifts or "Something went wrong",
#                                #   esc esc + continue for a spinner frozen 15 min. Never into a dialog.
# [chores.queue]                 # issues waiting for a seat: `owner/repo#N [scope]` per line; one is spawned
# file = "~/fleet/queue.txt"     #   (as `agent-fleet spawn`, in this checkout) while `profile` has fewer
# aliases = { "dv-" = "owner/repo" }  # optional: `dv-12` in the file means owner/repo#12
# profile = "devin"              #   live agents than its `cap`
# on = "build-box"              # optional: only this host drains the queue (`[chores.sweep]` takes `on` too)
# spawn_host = "build-box"      # optional: where the queued agent starts
#                                # (nudges type into agents: only under `host --stuck-act`)
# [chores.sweep]                 # a command run in this checkout, without a shell
# run = ["./scripts/clean"]
# every_min = 5

# `agent-fleet merge`, in a repository's own .agent-fleet/fleet.toml: read from the PR's base
# branch, so a PR cannot change its own gate.
# [merge]
# gate = "scripts/merge-gate.sh"  # run in this machine's checkout (on the base branch) with the head sha as $1; absent = the required CI checks
# host = "laptop"                # the fleet host that runs the merge and its gate; absent = where the CLI runs

# Repositories connected on this machine: "owner/repo" = "<checkout>". Edit with
# `agent-fleet repo add <owner/repo> [<dir>]` and `agent-fleet repo rm <owner/repo>`; the host
# re-reads this table at each spawn and each scan, so no restart is needed.
[repos]
