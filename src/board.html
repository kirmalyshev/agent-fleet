<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-fleet board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232f6fdf'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #fafbfc; --hover: #f1f4f9;
  --line: #e4e7ec; --line-2: #d3d8e0;
  --text: #171a1f; --text-2: #4d5662; --text-3: #6b7480;
  --accent: #2a62d6; --accent-soft: #e8effc;
  --ok: #177a43; --ok-soft: #e4f4ea; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #c0352f; --bad-soft: #fbe8e6;
  --idle: #7b8491;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-meta: 12px; --fs-body: 13px; --fs-ui: 14px; --fs-title: 15px;
  --row: 34px; --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1014; --surface: #14181d; --surface-2: #181d23; --hover: #1c222a;
    --line: #232a32; --line-2: #2e3640;
    --text: #e7eaee; --text-2: #aab2bc; --text-3: #848d98;
    --accent: #7aa7ff; --accent-soft: #1b2638;
    --ok: #58c88a; --ok-soft: #13271c; --warn: #e3ac55; --warn-soft: #2b2212; --bad: #f07a72; --bad-soft: #2d1716;
    --idle: #8a939e;
  }
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--line-2) transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font: var(--fs-body)/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: 12px; font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }

/* bar */
.bar { position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-top { display: flex; align-items: center; gap: 20px; padding: 10px 20px; min-height: 48px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-size: var(--fs-title); font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.stats { display: flex; gap: 2px; flex-wrap: wrap; }
.stat { display: inline-flex; align-items: baseline; gap: 6px; padding: 4px 10px; border: 0; background: none; border-radius: var(--r); cursor: pointer; color: var(--text-2); font-size: var(--fs-body); }
.stat:hover { background: var(--hover); color: var(--text); }
.stat b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; font-size: var(--fs-ui); }
.stat.ok b { color: var(--ok); } .stat.warn b { color: var(--warn); } .stat.bad b { color: var(--bad); }
.live { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: var(--fs-meta); white-space: nowrap; }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.live.stale i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.linkbtn { border: 0; background: none; color: var(--text-3); cursor: pointer; padding: 2px 4px; font-size: var(--fs-meta); }
.linkbtn:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
.bar-tabs { display: flex; align-items: flex-end; gap: 16px; padding: 0 20px; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
nav::-webkit-scrollbar { display: none; }
nav button { border: 0; background: none; padding: 9px 10px 10px; color: var(--text-2); cursor: pointer; white-space: nowrap; font-size: var(--fs-ui); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: baseline; }
nav button:hover { color: var(--text); }
nav button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
nav button .n { font-size: var(--fs-meta); color: var(--text-3); font-weight: 500; font-variant-numeric: tabular-nums; }
.search { position: relative; margin: 6px 0 8px; }
.search input { width: 240px; height: 30px; padding: 0 10px 0 30px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); color: var(--text); font: var(--fs-body) var(--sans); }
.search input::placeholder { color: var(--text-3); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 9px; top: 8px; width: 14px; height: 14px; color: var(--text-3); }

/* banners */
.banners { padding: 12px 20px 0; display: grid; gap: 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: var(--r); background: var(--bad-soft); color: var(--text); font-size: var(--fs-body); }
.banner svg { flex: none; width: 16px; height: 16px; margin-top: 1px; color: var(--bad); }
.banner b { font-weight: 600; }
.banner .sub { color: var(--text-2); overflow-wrap: anywhere; }
.banner.warn { background: var(--warn-soft); } .banner.warn svg { color: var(--warn); }

main { padding: 16px 20px 48px; }

/* panels and tables */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 550; font-size: var(--fs-meta); color: var(--text-3); padding: 0 12px; height: 32px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 0 12px; height: var(--row); border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--hover); }
th.r, td.r { text-align: right; }
th.fit, td.fit, th.r, td.r { width: 1%; }
td.wrap { white-space: normal; padding-top: 7px; padding-bottom: 7px; min-width: 240px; }
td.path { color: var(--text-3); max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
td.dim, .dim { color: var(--text-3); }

/* status */
.st { display: inline-flex; align-items: center; gap: 7px; font-weight: 550; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st.working { color: var(--ok); } .st.blocked, .st.failed { color: var(--bad); }
.st.unknown, .st.input-required { color: var(--warn); }
.st.idle, .st.done, .st.completed, .st.canceled, .st.submitted { color: var(--idle); }
.st.working-task { color: var(--ok); }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 4px; font-size: var(--fs-meta); font-weight: 600; white-space: nowrap; }
.k-hung, .k-orphan, .k-duplicate, .b-bad { background: var(--bad-soft); color: var(--bad); }
.k-heavy, .k-unpushed, .k-forgotten, .b-warn { background: var(--warn-soft); color: var(--warn); }
.k-stale, .b-dim { background: var(--surface-2); color: var(--text-3); box-shadow: inset 0 0 0 1px var(--line); }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.count-bad { color: var(--bad); font-weight: 650; }
.count-warn { color: var(--warn); font-weight: 650; }
.zero { color: var(--line-2); }

/* tree */
.tree { padding: 4px 0; }
.tree details > summary { list-style: none; cursor: pointer; }
.tree details > summary::-webkit-details-marker { display: none; }
.row { display: grid; grid-template-columns: 16px minmax(0, auto) minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: var(--row); padding: 3px 16px 3px 12px; }
.row:hover { background: var(--hover); }
.chev { width: 16px; height: 16px; color: var(--text-3); transition: transform 150ms cubic-bezier(.2, .8, .2, 1); }
details[open] > summary .chev { transform: rotate(90deg); }
.row .name { font-weight: 600; font-size: var(--fs-ui); white-space: nowrap; }
.row .branch { font-family: var(--mono); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.row .meta { color: var(--text-3); font-size: var(--fs-meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.kids { margin-left: 20px; border-left: 1px solid var(--line); }
.repo { border-bottom: 1px solid var(--line); }
.repo:last-child { border-bottom: 0; }
.repo > summary .row { min-height: 40px; }
.leaf { grid-template-columns: 16px 92px minmax(0, auto) minmax(0, 1fr) auto; }
.leaf .who { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
.leaf.task { padding-left: 32px; grid-template-columns: 92px minmax(0, auto) minmax(0, 1fr) auto; }
.leaf.task .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaf.none { color: var(--text-3); font-size: var(--fs-meta); grid-template-columns: 16px 1fr; }
.quiet > summary .row { color: var(--text-3); }

/* cards on doorbells / hosts */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
.cards div { background: var(--surface); padding: 12px 14px; }
.cards b { display: block; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.cards span { color: var(--text-3); font-size: var(--fs-meta); }
.cards .bad b { color: var(--bad); }
h2 { font-size: var(--fs-ui); font-weight: 600; margin: 0 0 8px; }
h2 .dim { font-weight: 400; }

/* empty, loading, gate */
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); }
.empty b { display: block; color: var(--text); font-size: var(--fs-ui); margin-bottom: 4px; }
.skeleton { padding: 8px 0; }
.skeleton div { height: 12px; margin: 14px 16px; border-radius: 4px; background: var(--line); }
.skeleton div:nth-child(2n) { width: 70%; } .skeleton div:nth-child(3n) { width: 45%; }
.gate { max-width: 460px; margin: 14vh auto 0; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px -16px rgb(0 0 0 / 0.25); }
.gate h1 { font-size: 18px; margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.gate h1 i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.gate p { color: var(--text-2); margin: 0 0 14px; }
.gate code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); overflow-wrap: anywhere; }
.gate form { display: flex; gap: 8px; margin-top: 16px; }
.gate input { flex: 1; height: 34px; padding: 0 10px; font: 12px var(--mono); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); color: var(--text); }
.gate input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.primary { height: 34px; padding: 0 14px; border: 0; border-radius: var(--r); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
@media (prefers-color-scheme: dark) { .primary { color: #0b1220; } }
.primary:hover { filter: brightness(1.06); }
.err { color: var(--bad); margin-top: 10px; }

@media (max-width: 720px) {
  .bar-top, .bar-tabs, main, .banners { padding-left: 12px; padding-right: 12px; }
  .bar-tabs { flex-wrap: wrap; gap: 0; }
  nav { flex-basis: 100%; }
  .search { width: 100%; margin-top: 0; }
  .bar-top { gap: 8px 12px; }
  .search input { width: 100%; }
  .live { margin-left: 0; }
  .hide-sm { display: none; }
  .row { grid-template-columns: 16px minmax(0, 1fr) auto; }
  .row .meta { grid-column: 2 / -1; grid-row: 2; }
  .leaf { grid-template-columns: 16px auto minmax(0, 1fr); }
  .leaf .meta { grid-column: 2 / -1; }
  .leaf .right { grid-column: 2 / -1; justify-content: flex-start; }
  .leaf.task { grid-template-columns: auto minmax(0, 1fr); }
  .leaf.task .title { grid-column: 1 / -1; white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const KEY = "agent-fleet-token";
const TABS = ["tree", "agents", "worktrees", "tasks", "findings", "doorbells", "hosts"];
const LABEL = { tree: "Tree", agents: "Agents", worktrees: "Worktrees", tasks: "Tasks", findings: "Findings", doorbells: "Doorbells", hosts: "Hosts" };
const TERMINAL = ["completed", "failed", "canceled"];
const openState = {};
let token = null, data = null, stats = null, tab = "tree", filter = "", err = null, loadedAt = 0, statsAt = 0;
try { token = localStorage.getItem(KEY); tab = localStorage.getItem(KEY + "-tab") || tab; } catch (_) {}
// `agent-fleet ui` opens /#token=…: the fragment never reaches a server; keep it here, drop it from the address bar.
{
  const m = location.hash.match(/token=([^&]+)/);
  if (m) {
    token = decodeURIComponent(m[1]);
    try { localStorage.setItem(KEY, token); } catch (_) {}
    history.replaceState(null, "", location.pathname + location.search);
  }
}
if (!TABS.includes(tab)) tab = "tree";

const ICON = {
  chev: `<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>`,
  search: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>`,
  alert: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.2L14.6 13.5H1.4z"/><path d="M8 6.5v3"/><path d="M8 11.6v.1"/></svg>`,
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = id => String(id ?? "").split("/").pop();
const home = p => String(p ?? "").replace(/(^|[\s:+])\/(home|Users)\/[^/]+\//g, "$1~/");
const mb = kb => kb == null ? "" : kb >= 1048576 ? (kb / 1048576).toFixed(1) + " GB" : Math.round(kb / 1024) + " MB";
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Math.round((Date.now() - Date.parse(ts)) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + "m";
  return Math.floor(s / 86400) + "d";
}
const dur = ms => ms == null ? "–" : ms < 1000 ? ms + " ms" : ms < 60000 ? (ms / 1000).toFixed(1) + " s" : Math.floor(ms / 60000) + "m " + String(Math.round(ms / 1000) % 60).padStart(2, "0") + "s";
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
const st = (state, label = state) => `<span class="st ${esc(state)}">${esc(label)}</span>`;
const badge = (cls, text, title = "") => `<span class="badge ${cls}"${title ? ` title="${esc(title)}"` : ""}>${esc(text)}</span>`;
const match = (...parts) => !filter || parts.join(" ").toLowerCase().includes(filter);
const det = (key, dflt) => `data-k="${esc(key)}"${(key in openState ? openState[key] : dflt) ? " open" : ""}`;
const n0 = (v, cls) => v ? `<span class="${cls}">${v}</span>` : `<span class="zero">0</span>`;

async function get(path) {
  const r = await fetch(path, { headers: { Authorization: "Bearer " + token }, cache: "no-store" });
  if (r.status === 401) { token = null; try { localStorage.removeItem(KEY); } catch (_) {} throw new Error("The hub refused this token."); }
  if (!r.ok) throw new Error(`The hub answered ${r.status} for ${path}.`);
  return r.json();
}

async function refresh() {
  if (!token) return render();
  try {
    data = await get("/board");
    if (Date.now() - statsAt > 30000) { stats = await get("/stats?since=86400"); statsAt = Date.now(); }
    err = null; loadedAt = Date.now();
  } catch (e) { err = e.message || "The hub is unreachable."; }
  render();
}

/* ---------- shared indexes ---------- */
function indexes(s) {
  const flags = {};
  for (const f of data.findings) for (const subj of f.subject.split(" + ")) (flags[subj] = flags[subj] || []).push(f);
  const tasksOf = {};
  for (const [id, t] of Object.entries(s.tasks)) if (t.owner && !TERMINAL.includes(t.state)) (tasksOf[t.owner] = tasksOf[t.owner] || []).push([id, t]);
  const blockers = {};
  for (const b of Object.values(s.blockers)) if (b.task) (blockers[b.task] = blockers[b.task] || []).push(b);
  const inWt = {};
  for (const [id, k] of Object.entries(data.worktree_of)) (inWt[k] = inWt[k] || []).push(id);
  return { flags, tasksOf, blockers, inWt };
}
const findingBadges = (ix, subj) => (ix.flags[subj] || []).map(f => badge("k-" + f.kind, f.kind, f.detail)).join("");
const usage = u => u?.cpu_pct != null ? `${u.cpu_pct}% · ${mb(u.rss_kb)}` : "";

/* ---------- tree ---------- */
function treeTab(s) {
  const ix = indexes(s);
  const placed = new Set(Object.keys(data.worktree_of));
  const taskLeaf = ([id, t]) => {
    const bs = ix.blockers[id] || [];
    const title = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>` : esc(t.title);
    return `<div class="row leaf task">${st(t.state)}<span class="mono">${esc(id.replace(/^task:/, ""))}</span><span class="title">${title}</span>
      <span class="right">${bs.map(b => badge("b-bad", "blocked", b.what + (b.unblocks_when ? " · until " + b.unblocks_when : ""))).join("")}<span class="meta num">${ago(t.since)}</span></span></div>`;
  };
  const agentLeaf = id => {
    const a = s.agents[id], ts = ix.tasksOf[id] || [];
    return `<div class="row leaf"><span></span>${st(a.state)}<span class="who">${esc(short(id))}</span>
      <span class="meta">${esc(a.host)} · for ${ago(a.since)}${a.usage?.cpu_pct != null ? " · " + usage(a.usage) : ""}</span>
      <span class="right">${findingBadges(ix, id)}</span></div>${ts.map(taskLeaf).join("")}`;
  };
  const repos = {};
  for (const [k, w] of Object.entries(s.worktrees)) {
    const rk = w.state.host + ":" + w.state.repo;
    (repos[rk] = repos[rk] || { key: rk, host: w.state.host, repo: w.state.repo, wts: [] }).wts.push([k, w]);
  }
  const weight = ([k, w]) => {
    const ags = ix.inWt[k] || [];
    if (ags.some(id => s.agents[id]?.state === "working")) return 0;
    if (ags.length) return 1;
    if ((ix.flags[k] || []).length) return 2;
    return (w.state.unpushed || w.state.dirty) ? 3 : 4;
  };
  const wtNode = ([k, w]) => {
    const t = w.state, p = s.worktree_procs[k]?.procs, ags = ix.inWt[k] || [];
    const right = [
      t.unpushed ? badge("b-warn", `${t.unpushed} unpushed`) : "",
      t.dirty ? badge("b-warn", `${t.dirty} dirty`) : "",
      p ? badge("b-dim", `runs ${p.procs} · ${mb(p.rss_kb)}`, p.names.join(", ")) : "",
      findingBadges(ix, k),
      `<span class="meta num">${ago(t.last_commit)}</span>`,
    ].join("");
    const open = ags.length > 0 || (ix.flags[k] || []).length > 0;
    return `<details ${det("w:" + k, open)}><summary><div class="row">${ICON.chev}
      <span class="branch">${esc(t.branch || "detached HEAD")}${t.path === t.repo ? ` <span class="badge b-dim">main</span>` : ""}</span>
      <span class="meta">${esc(home(t.path))}</span><span class="right">${right}</span></div></summary>
      <div class="kids">${ags.map(agentLeaf).join("") || `<div class="row leaf none"><span></span>No agent works here.</div>`}</div></details>`;
  };
  const repoNodes = Object.values(repos)
    .filter(r => match(r.repo, r.host, ...r.wts.map(([k, w]) => (w.state.branch || "") + " " + (ix.inWt[k] || []).join(" "))))
    .sort((a, b) => a.repo.split("/").pop().localeCompare(b.repo.split("/").pop()) || a.host.localeCompare(b.host))
    .map(r => {
      const wts = r.wts.sort((x, y) => weight(x) - weight(y) || (x[1].state.branch || "").localeCompare(y[1].state.branch || ""));
      const active = wts.filter(x => weight(x) < 4), quiet = wts.filter(x => weight(x) === 4);
      const ags = wts.flatMap(([k]) => ix.inWt[k] || []);
      const working = ags.filter(id => s.agents[id]?.state === "working").length;
      const nflags = wts.reduce((n, [k]) => n + (ix.flags[k] || []).length, 0) + ags.reduce((n, id) => n + (ix.flags[id] || []).length, 0);
      const unsaved = wts.filter(([, w]) => w.state.unpushed || w.state.dirty).length;
      const right = [
        working ? badge("b-ok", `${working} working`) : "",
        unsaved ? badge("b-warn", `${unsaved} unsaved`) : "",
        nflags ? badge("b-bad", plural(nflags, "finding")) : "",
      ].join("");
      return `<details class="repo" ${det("r:" + r.key, true)}><summary><div class="row">${ICON.chev}
        <span class="name">${esc(r.repo.split("/").pop())}</span>
        <span class="meta">${esc(r.host)} · ${plural(wts.length, "worktree")} · ${plural(ags.length, "agent")}</span><span class="right">${right}</span></div></summary>
        <div class="kids">${active.map(wtNode).join("")}
        ${quiet.length ? `<details class="quiet" ${det("q:" + r.key, false)}><summary><div class="row">${ICON.chev}<span>${plural(quiet.length, "quiet worktree")}</span>
          <span class="meta">no agent, nothing unsaved, no findings</span><span></span></div></summary><div class="kids">${quiet.map(wtNode).join("")}</div></details>` : ""}</div>
      </details>`;
    });
  const loose = Object.keys(s.agents).filter(id => !placed.has(id) && match(id, s.agents[id].host, s.agents[id].state)).sort();
  const looseNode = loose.length ? `<details class="repo" ${det("loose", true)}><summary><div class="row">${ICON.chev}<span class="name">Outside a known worktree</span>
    <span class="meta">${plural(loose.length, "agent")} · their host has not placed them yet</span><span></span></div></summary><div class="kids">${loose.map(agentLeaf).join("")}</div></details>` : "";
  const unowned = Object.entries(s.tasks).filter(([id, t]) => !TERMINAL.includes(t.state) && !(t.owner && s.agents[t.owner]) && match(id, t.title));
  const byProject = {};
  for (const e of unowned) (byProject[e[1].project] = byProject[e[1].project] || []).push(e);
  const taskNode = unowned.length ? `<details class="repo" ${det("tasks", true)}><summary><div class="row">${ICON.chev}<span class="name">Open tasks with no agent up</span>
    <span class="meta">${plural(unowned.length, "task")}</span><span></span></div></summary><div class="kids">
    ${Object.entries(byProject).map(([p, ts]) => `<details ${det("p:" + p, true)}><summary><div class="row">${ICON.chev}<span class="branch">${esc(p)}</span>
      <span class="meta">${plural(ts.length, "task")}</span><span></span></div></summary><div class="kids">${ts.map(taskLeaf).join("")}</div></details>`).join("")}</div></details>` : "";
  const all = repoNodes.join("") + looseNode + taskNode;
  return all ? `<div class="panel tree">${all}</div>`
    : empty(filter ? "Nothing matches the filter" : "No worktrees reported yet", filter ? "Clear the filter to see the whole fleet." : "Each host agent scans its repositories every 5 minutes; the tree fills in after the first scan.");
}

/* ---------- tables ---------- */
function agentsTab(s) {
  const ix = indexes(s);
  const order = { blocked: 0, unknown: 1, working: 2, idle: 3, done: 4 };
  const owned = {};
  for (const [id, t] of Object.entries(s.tasks)) if (t.owner && !TERMINAL.includes(t.state)) owned[t.owner] = id;
  const rows = Object.entries(s.agents)
    .filter(([id, a]) => match(id, a.host, a.state, owned[id], data.worktree_of[id]))
    .sort(([ia, a], [ib, b]) => (order[a.state] - order[b.state]) || a.host.localeCompare(b.host) || ia.localeCompare(ib));
  const branch = id => { const w = s.worktrees[data.worktree_of[id]]; return w ? (w.state.branch || "detached HEAD") : ""; };
  return table([["Agent"], ["State", "fit"], ["For", "r"], ["CPU", "r"], ["Memory", "r"], ["Task"], ["Branch", "hide-sm"], ["Host", "hide-sm"], ["Findings"]], rows.map(([id, a]) => {
    const u = a.usage;
    return `<tr><td class="mono">${esc(short(id))}</td><td>${st(a.state)}</td><td class="r num">${ago(a.since)}</td>
      <td class="r num">${u?.cpu_pct != null ? u.cpu_pct + "%" : `<span class="zero">–</span>`}</td><td class="r num">${u?.rss_kb != null ? mb(u.rss_kb) : `<span class="zero">–</span>`}</td>
      <td class="mono">${esc(short(owned[id] || ""))}</td><td class="mono hide-sm">${esc(branch(id))}</td><td class="dim hide-sm">${esc(a.host)}</td><td>${findingBadges(ix, id)}</td></tr>`;
  }), ["No agents up", "Agents appear here as soon as a host agent sees them in herdr."]);
}

function worktreesTab(s) {
  const ix = indexes(s);
  const keys = Object.keys(s.worktrees).concat(Object.keys(s.worktree_procs).filter(k => s.worktree_procs[k].procs.orphaned));
  const rows = keys.filter(k => match(k, s.worktrees[k]?.state.branch, (ix.inWt[k] || []).join(" ")));
  return table([["Branch"], ["Agent"], ["Unpushed", "r"], ["Dirty", "r"], ["Runs", "r"], ["Last commit", "r"], ["Findings"], ["Host", "hide-sm"], ["Path", "hide-sm"]], rows.map(k => {
    const w = s.worktrees[k], p = s.worktree_procs[k]?.procs;
    const runs = p ? `<span title="${esc(p.names.join(", "))}">${p.procs} · ${mb(p.rss_kb)}</span>` : `<span class="zero">–</span>`;
    if (!w) return `<tr><td>${badge("b-bad", "worktree deleted")}</td><td></td><td></td><td></td><td class="r num">${runs}</td><td></td>
      <td>${findingBadges(ix, k)}</td><td class="dim hide-sm">${esc(p.host)}</td><td class="mono path hide-sm">${esc(home(p.path))}</td></tr>`;
    const t = w.state;
    return `<tr><td class="mono">${esc(t.branch || "detached HEAD")}</td><td class="mono">${esc((ix.inWt[k] || []).map(short).join(", "))}</td>
      <td class="r num">${n0(t.unpushed, "count-warn")}</td><td class="r num">${n0(t.dirty, "count-warn")}</td><td class="r num">${runs}</td>
      <td class="r num">${ago(t.last_commit)}</td><td>${findingBadges(ix, k)}</td><td class="dim hide-sm">${esc(t.host)}</td><td class="mono path hide-sm" title="${esc(t.path)}">${esc(home(t.path))}</td></tr>`;
  }), ["No worktrees reported yet", "Host agents report every git worktree of the repositories their agents work in."]);
}

function tasksTab(s) {
  const ix = indexes(s);
  const rows = Object.entries(s.tasks).filter(([id, t]) => match(id, t.title, t.owner, t.state))
    .sort(([, a], [, b]) => (TERMINAL.includes(a.state) - TERMINAL.includes(b.state)) || Date.parse(b.since) - Date.parse(a.since));
  return table([["Task"], ["State"], ["Owner"], ["Blockers", "r"], ["For", "r"], ["Title"]], rows.map(([id, t]) => {
    const bs = ix.blockers[id] || [];
    const title = t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>` : esc(t.title);
    return `<tr><td class="mono">${esc(id.replace(/^task:/, ""))}</td><td>${st(t.state)}</td><td class="mono">${esc(short(t.owner || "")) || `<span class="zero">–</span>`}</td>
      <td class="r num" title="${esc(bs.map(b => b.what).join("\n"))}">${n0(bs.length, "count-bad")}</td><td class="r num">${ago(t.since)}</td><td class="wrap">${title}</td></tr>`;
  }), ["No tasks yet", "Agents record theirs with agent-fleet task add when they start an issue."]);
}

function findingsTab() {
  const rows = data.findings.filter(f => match(f.kind, f.subject, f.detail));
  return table([["Kind"], ["About"], ["What"]], rows.map(f =>
    `<tr><td>${badge("k-" + f.kind, f.kind)}</td><td class="mono path" title="${esc(f.subject)}">${esc(home(f.subject))}</td><td class="wrap">${esc(f.detail)}</td></tr>`),
    ["Nothing needs a look", "Stale, hung or heavy agents, duplicate work, forgotten worktrees, unpushed commits and orphans show up here."]);
}

function doorbellsTab(s) {
  const d = stats?.log?.doorbells;
  const cards = d ? `<div class="cards">
    ${card(d.sent, "sent, last 24 h")}${card(d.delivered, "delivered")}${card(d.pending, "waiting now")}${card(d.lost, "lost, undelivered > 10 min", d.lost > 0)}
    ${card(dur(d.total_ms.p50), "send → working, median")}${card(dur(d.total_ms.p90), "p90, includes busy agents")}${card(dur(d.react_ms.p50), "ring → working, median")}${card(d.retried, "needed a second ring", false)}
  </div>` : "";
  const rows = Object.entries(s.msgs).filter(([, m]) => match(m.from, m.to, m.kind, m.text)).sort(([, a], [, b]) => Date.parse(a.since) - Date.parse(b.since));
  return cards + `<h2>Undelivered <span class="dim">· waiting for the recipient to be free</span></h2>` +
    table([["Waiting", "r"], ["From"], ["To"], ["Kind"], ["Ref", "hide-sm"], ["Text"]], rows.map(([, m]) =>
      `<tr><td class="r num">${ago(m.since)}</td><td class="mono">${esc(short(m.from))}</td><td class="mono">${esc(short(m.to))}</td>
       <td>${esc(m.kind)}</td><td class="mono hide-sm">${esc(m.reference)}</td><td class="wrap">${esc(m.text)}</td></tr>`),
      ["Every doorbell is delivered", "A message waits here only while its recipient is busy or its host is out of reach."]);
}

function hostsTab(s) {
  const hs = stats?.log?.hosts || {}, hub = stats?.hub;
  const cards = hub ? `<div class="cards">${card(dur(hub.uptime_s * 1000), "hub up")}${card(mb(hub.max_rss_kb), "hub memory")}
    ${card(hub.events, "events in the log")}${card(hub.followers, "followers")}${card(dur(Math.round(hub.post_us.p50 / 1000)), "write, median")}</div>` : "";
  const rows = Object.entries(s.hosts).filter(([h]) => match(h));
  return cards + table([["Host"], ["Agents", "r"], ["Disk free", "r"], ["Last report", "r"], ["Up", "r"], ["Memory", "r"], ["Rings", "r"], ["herdr errors", "r"], ["Spooled", "r"]], rows.map(([h, x]) => {
    const l = hs[h]?.last, late = Date.now() - Date.parse(x.ts) > 180000, gb = b => (b / 1e9).toFixed(1);
    return `<tr><td class="mono">${esc(h)}</td><td class="r num">${x.agents}</td><td class="r num">${gb(x.disk_free)} of ${gb(x.disk_total)} GB</td>
      <td class="r num">${late ? `<span class="count-bad">${ago(x.ts)} ago</span>` : ago(x.ts) + " ago"}</td><td class="r num">${l ? dur(l.uptime_s * 1000) : ""}</td>
      <td class="r num">${l ? mb(l.max_rss_kb) : ""}</td><td class="r num">${l ? l.rings + (l.ring_failures ? ` <span class="count-bad">(${l.ring_failures} failed)</span>` : "") : ""}</td>
      <td class="r num">${l ? n0(l.herdr_errors, "count-warn") : ""}</td><td class="r num">${l ? n0(l.spooled, "count-warn") : ""}</td></tr>`;
  }), ["No host has reported", "Start agent-fleet host on each machine; it reports every minute."]);
}

const card = (v, l, bad = false) => `<div class="${bad ? "bad" : ""}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
const empty = (title, hint) => `<div class="panel"><div class="empty"><b>${esc(title)}</b>${esc(hint)}</div></div>`;
function table(head, rows, [title, hint]) {
  if (!rows.length) return filter ? empty("Nothing matches the filter", "Clear the filter to see everything.") : empty(title, hint);
  return `<div class="panel"><div class="scroll"><table><thead><tr>${head.map(([h, cls = ""]) => `<th class="${cls}">${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div></div>`;
}

/* ---------- shell ---------- */
function gate() {
  return `<div class="gate"><h1><i></i>agent-fleet</h1>
    <p>Run <code>agent-fleet ui</code> to open this board signed in, or paste the hub's token. It stays in this browser.</p>
    <p class="dim">The token is in <code>~/Library/Application Support/agent-fleet/token</code> on macOS and <code>~/.local/share/agent-fleet/token</code> on Linux.</p>
    ${err ? `<div class="err">${esc(err)}</div>` : ""}
    <form id="tf"><input id="ti" type="password" autocomplete="off" placeholder="hub token" aria-label="hub token" autofocus><button class="primary">Open the board</button></form></div>`;
}

function render() {
  const app = document.getElementById("app");
  if (!token) { app.innerHTML = gate(); bindGate(); return; }
  const focused = document.activeElement?.id === "q";
  const caret = focused ? document.activeElement.selectionStart : null;
  if (!data) {
    app.innerHTML = shell({ agents: 0 }, "", err ? empty("The hub is unreachable", err + " Retrying every 3 seconds.") : `<div class="panel skeleton">${"<div></div>".repeat(8)}</div>`, []);
    bind(focused, caret);
    return;
  }
  const s = data.state, a = Object.values(s.agents);
  const count = x => a.filter(v => v.state === x).length;
  const open = Object.values(s.tasks).filter(t => !TERMINAL.includes(t.state)).length;
  const undelivered = Object.keys(s.msgs).length;
  const n = {
    tree: new Set(Object.values(s.worktrees).map(w => w.state.host + ":" + w.state.repo)).size, agents: a.length,
    worktrees: Object.keys(s.worktrees).length, tasks: open, findings: data.findings.length, doorbells: undelivered, hosts: Object.keys(s.hosts).length,
  };
  const statsBar = [
    ["agents", `<b>${a.length}</b> agents`, ""],
    ["agents", `<b>${count("working")}</b> working`, count("working") ? "ok" : ""],
    ["agents", `<b>${count("idle") + count("done")}</b> idle`, ""],
    count("blocked") ? ["agents", `<b>${count("blocked")}</b> blocked`, "bad"] : null,
    ["tasks", `<b>${open}</b> open tasks`, ""],
    ["findings", `<b>${data.findings.length}</b> findings`, data.findings.length ? "warn" : ""],
    undelivered ? ["doorbells", `<b>${undelivered}</b> undelivered`, "warn"] : null,
  ].filter(Boolean).map(([t, html, cls]) => `<button class="stat ${cls}" data-tab="${t}">${html}</button>`).join("");
  const alerts = data.findings.filter(f => ["orphan", "hung", "duplicate"].includes(f.kind)).slice(0, 3)
    .map(f => `<div class="banner">${ICON.alert}<div><b>${esc(f.kind)}</b> · <span class="mono">${esc(home(f.subject))}</span><div class="sub">${esc(f.detail)}</div></div></div>`);
  if (err) alerts.unshift(`<div class="banner warn">${ICON.alert}<div><b>Showing data from ${ago(new Date(loadedAt).toISOString())} ago.</b><div class="sub">${esc(err)} Retrying every 3 seconds.</div></div></div>`);
  const body = { tree: treeTab, agents: agentsTab, worktrees: worktreesTab, tasks: tasksTab, findings: findingsTab, doorbells: doorbellsTab, hosts: hostsTab }[tab](s);
  app.innerHTML = shell(n, statsBar, body, alerts);
  bind(focused, caret);
}

function shell(n, statsBar, body, alerts) {
  const stale = err || !loadedAt;
  return `<header class="bar">
    <div class="bar-top"><div class="brand"><i></i>agent-fleet</div><div class="stats">${statsBar}</div>
      <div class="live ${stale ? "stale" : ""}"><i></i>${loadedAt ? `${stale ? "last update" : "live"} · ${ago(new Date(loadedAt).toISOString())} ago` : "connecting"}
        <button class="linkbtn" id="out" title="Forget the token in this browser">Sign out</button></div></div>
    <div class="bar-tabs"><nav aria-label="views">${TABS.map(t => `<button data-tab="${t}" class="${t === tab ? "on" : ""}" aria-current="${t === tab ? "page" : "false"}">${LABEL[t]}${n[t] != null ? `<span class="n">${n[t]}</span>` : ""}</button>`).join("")}</nav>
      <label class="search">${ICON.search}<input id="q" type="search" placeholder="Filter" aria-label="Filter" value="${esc(filter)}"></label></div>
  </header>
  ${alerts.length ? `<div class="banners">${alerts.join("")}</div>` : ""}
  <main>${body}</main>`;
}

function bind(focused, caret) {
  const app = document.getElementById("app");
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem(KEY + "-tab", tab); } catch (_) {} render(); });
  app.querySelectorAll("details[data-k]").forEach(d => d.ontoggle = () => { openState[d.dataset.k] = d.open; });
  const q = document.getElementById("q");
  q.oninput = () => { filter = q.value.trim().toLowerCase(); render(); };
  if (focused) { q.focus(); q.setSelectionRange(caret ?? q.value.length, caret ?? q.value.length); }
  document.getElementById("out").onclick = () => { token = null; data = null; try { localStorage.removeItem(KEY); } catch (_) {} render(); };
}

function bindGate() {
  document.getElementById("tf").onsubmit = e => {
    e.preventDefault();
    token = document.getElementById("ti").value.trim();
    if (!token) return;
    try { localStorage.setItem(KEY, token); } catch (_) {}
    data = null; statsAt = 0; err = null; refresh();
  };
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
